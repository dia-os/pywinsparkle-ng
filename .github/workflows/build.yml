name: Test and build Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          architecture: x64
      - run: python -m pip install build
      - run: python tools/vendor_winsparkle.py
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip install --force-reinstall (Get-ChildItem dist/*.whl).FullName
      - name: Verify installed DLL and native ABI without initializing UI
        working-directory: '${{ runner.temp }}'
        run: python -c "from pywinsparkle import pywinsparkle as w; w._load(); print('All exports bound successfully')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-python-${{ matrix.python }}
          path: dist/*
