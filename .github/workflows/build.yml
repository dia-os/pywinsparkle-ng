name: Test and build Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: nuget/setup-nuget@v2
      - name: Build patched WinSparkle x64 DLL
        shell: pwsh
        run: ./tools/build_winsparkle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: winsparkle-patched-x64
          path: |
            pywinsparkle/libs/x64/WinSparkle.dll
            pywinsparkle/libs/x64/COPYING
            pywinsparkle/libs/x64/COPYING.expat
            pywinsparkle/libs/x64/native-build.json
          if-no-files-found: error
  build:
    needs: native
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          architecture: x64
      - run: python -m pip install build
      - uses: actions/download-artifact@v4
        with:
          name: winsparkle-patched-x64
          path: pywinsparkle/libs/x64
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip install --force-reinstall (Get-ChildItem dist/*.whl).FullName
      - name: Verify installed patched DLL and native ABI without initializing UI
        working-directory: '${{ runner.temp }}'
        run: |
          python -c "import hashlib,json; from pathlib import Path; from pywinsparkle import pywinsparkle as w; p=Path(w.__file__).parent/'libs'/'x64'; info=json.loads((p/'native-build.json').read_text(encoding='utf-8-sig')); assert hashlib.sha256((p/'WinSparkle.dll').read_bytes()).hexdigest() == info['dll_sha256'], 'DLL digest mismatch'; w._load(); print('Patched DLL verified; all exports bound successfully')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-python-${{ matrix.python }}
          path: dist/*
